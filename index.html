<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#bfe7f4">
  <title>สแกน QR ทรัพย์สิน</title>
  <style>
    :root{--blue:#bfe7f4;--green:#dff4ea;--pink:#fde8ef;--ink:#244b5f;--muted:#6f8792;--line:#d7e7ee;--card:#fff;--primary:#58add3}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(160deg,var(--blue),#f8fcff 45%,var(--green) 75%,var(--pink));color:var(--ink)}
    body{min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom))}
    .wrap{max-width:620px;margin:0 auto}
    .card{background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.8);border-radius:24px;padding:20px;box-shadow:0 18px 48px rgba(42,104,132,.15)}
    .head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .icon{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#72c1df,#8ed5bf);display:grid;place-items:center;font-size:30px;color:#fff}
    h1{font-size:25px;margin:0}.sub{font-size:14px;color:var(--muted);margin-top:3px}
    #reader{width:100%;min-height:280px;border-radius:18px;overflow:hidden;background:#10252f;margin-top:14px}
    #reader video{width:100%!important;height:auto!important;min-height:300px;object-fit:cover;background:#10252f}
    .status{margin:12px 0;padding:12px 14px;border-radius:14px;background:#f4f9fb;color:#4d6975;white-space:pre-wrap;font-size:14px}
    .status.ok{background:#eaf8ef;color:#24643a}.status.err{background:#fff0f0;color:#a53a3a}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    button,.btn,input{font:inherit;min-height:48px;border-radius:14px;border:1px solid var(--line)}
    button,.btn{cursor:pointer;padding:11px 14px;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
    .primary{background:linear-gradient(135deg,#64b8d9,#6dc8b0);color:white;border:0;font-weight:700}
    .secondary{background:white;color:var(--ink)}
    .manual{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}
    .manual input{width:100%;padding:10px 13px;background:white}
    .hint{margin-top:14px;font-size:13px;line-height:1.6;color:var(--muted)}
    #photoInput{display:none}
    @media(max-width:520px){.card{padding:16px;border-radius:20px}.actions{grid-template-columns:1fr}h1{font-size:22px}#reader{min-height:250px}#reader video{min-height:260px}}
  </style>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'"></script>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="head">
        <div class="icon">✓</div>
        <div><h1>สแกน QR ทรัพย์สิน</h1><div class="sub">ระบบบริหารทรัพย์สินสาขา</div></div>
      </div>

      <div id="reader"></div>
      <div id="status" class="status">กด “เปิดกล้องสแกน QR” แล้วอนุญาตการใช้กล้อง</div>

      <div class="actions">
        <button class="primary" id="startBtn" onclick="startScanner()">📷 เปิดกล้องสแกน QR</button>
        <button class="secondary" onclick="openPhoto()">🖼 ถ่าย/เลือกรูป QR</button>
      </div>
      <input id="photoInput" type="file" accept="image/png,image/jpeg,image/jpg,image/*" capture="environment" onchange="scanPhoto(this.files&&this.files[0])">

      <div class="manual">
        <input id="manualCode" autocomplete="off" placeholder="กรอกรหัสทรัพย์สิน เช่น ART-MPM01">
        <button class="secondary" onclick="submitManual()">ค้นหา</button>
      </div>

      <div class="hint">เมื่อสแกนสำเร็จ ระบบจะกลับไปยัง Web App อัตโนมัติ และเปิดข้อมูล/PDF ของรหัสทรัพย์สินที่สแกน หากเปิดจาก iPad/iPhone แนะนำใช้ Safari และกดอนุญาตกล้องเมื่อระบบถาม</div>
      <div class="actions"><a class="btn secondary" href="https://script.google.com/macros/s/AKfycbxMeaP27QPlUZgE25Ae3C3xr_xkRXDBKC1NlO7IDoEVkDXt7dxED2LjphOK9jq1017sow/exec">กลับสู่ระบบทรัพย์สิน</a></div>
    </section>
  </main>

<script>
const APP_URL="https://script.google.com/macros/s/AKfycbxMeaP27QPlUZgE25Ae3C3xr_xkRXDBKC1NlO7IDoEVkDXt7dxED2LjphOK9jq1017sow/exec";
let scanner=null,done=false;
const $=id=>document.getElementById(id);
function setStatus(text,type=''){const e=$('status');e.textContent=text;e.className='status '+type;}
function normalizeCode(value){
  let s=String(value||'').trim();
  if(!s)return '';
  try{
    if(/^https?:\/\//i.test(s)){
      const u=new URL(s);
      s=u.searchParams.get('asset')||u.searchParams.get('id')||u.searchParams.get('code')||s;
    }
  }catch(_e){}
  return s.trim();
}
async function finish(value){
  if(done)return;
  const code=normalizeCode(value);
  if(!code)return setStatus('ไม่พบรหัสทรัพย์สินจาก QR','err');
  done=true;
  setStatus('สแกนสำเร็จ: '+code+'\nกำลังกลับเข้าสู่ระบบ...','ok');
  try{if(scanner)await scanner.stop();}catch(_e){}
  const url=APP_URL+(APP_URL.includes('?')?'&':'?')+'asset='+encodeURIComponent(code)+'&source=github-scanner';
  setTimeout(()=>location.replace(url),250);
}
async function startScanner(){
  done=false;
  $('startBtn').disabled=true;
  setStatus('กำลังขอสิทธิ์กล้อง...');
  try{
    let tries=0; while(typeof Html5Qrcode==='undefined'&&tries<60){await new Promise(r=>setTimeout(r,100));tries++;}
    if(typeof Html5Qrcode==='undefined')throw new Error('โหลดตัวอ่าน QR ไม่สำเร็จ');
    if(scanner){try{await scanner.stop();}catch(_e){} try{await scanner.clear();}catch(_e){}}
    scanner=new Html5Qrcode('reader');
    let cameras=[];try{cameras=await Html5Qrcode.getCameras();}catch(_e){}
    let cameraConfig={facingMode:{ideal:'environment'}};
    if(cameras.length){
      const back=cameras.find(c=>/back|rear|environment|หลัง/i.test(c.label||''));
      cameraConfig=(back||cameras[cameras.length-1]).id;
    }
    await scanner.start(cameraConfig,{
      fps:12,
      qrbox:(w,h)=>{const s=Math.max(180,Math.min(Math.floor(Math.min(w,h)*0.72),320));return {width:s,height:s};},
      aspectRatio:1.0,
      disableFlip:false
    },decoded=>finish(decoded),()=>{});
    const v=document.querySelector('#reader video');
    if(v){v.setAttribute('playsinline','true');v.setAttribute('webkit-playsinline','true');v.muted=true;v.autoplay=true;try{await v.play();}catch(_e){}}
    setStatus('กล้องพร้อมใช้งาน — หันกล้องไปที่ QR ทรัพย์สิน','ok');
  }catch(e){
    $('startBtn').disabled=false;
    setStatus('เปิดกล้องไม่สำเร็จ: '+(e&&e.message?e.message:e)+'\nกรุณาตรวจสิทธิ์กล้อง หรือใช้ “ถ่าย/เลือกรูป QR”','err');
  }
}
function openPhoto(){const i=$('photoInput');i.value='';i.click();}
async function scanPhoto(file){
  if(!file)return;
  setStatus('กำลังอ่าน QR จากภาพ...');
  try{
    let tries=0; while(typeof Html5Qrcode==='undefined'&&tries<60){await new Promise(r=>setTimeout(r,100));tries++;}
    if(typeof Html5Qrcode==='undefined')throw new Error('โหลดตัวอ่าน QR ไม่สำเร็จ');
    const temp=document.createElement('div');temp.id='fileQrReader';temp.style.cssText='position:fixed;left:-9999px;top:-9999px;width:320px;height:320px';document.body.appendChild(temp);
    const q=new Html5Qrcode('fileQrReader');
    const decoded=await q.scanFile(file,true);
    try{await q.clear();}catch(_e){}
    temp.remove();
    await finish(decoded);
  }catch(e){setStatus('อ่าน QR จากภาพไม่สำเร็จ กรุณาถ่ายให้ QR ชัดและอยู่กลางภาพ\n'+(e&&e.message?e.message:e),'err');}
}
function submitManual(){const code=$('manualCode').value.trim();if(!code)return setStatus('กรุณากรอกรหัสทรัพย์สิน','err');finish(code);}
$('manualCode').addEventListener('keydown',e=>{if(e.key==='Enter')submitManual();});
</script>
</body>
</html>
